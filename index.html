<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&family=Mogra&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="image_logo">
  <!-- bg image FIRST -->
  <img class="bg-image" src="img.jpg" alt="image" width="500px"/>
  <!-- logo SECOND with class -->
  <img class="logo" src="odin-lined.png" alt="LOGO"/>
</div>
    <form>
      <legend>Let's do this!</legend>
      <div class="fname_lname">
        <div class="form-group">
          <label for="fname">FIRST NAME</label>
          <input type="text" id="fname" name="first_name" required />
        </div>
        <div class="form-group">
          <label for="lname">LAST NAME</label>
          <input type="text" id="lname" name="last_name" required />
        </div>
      </div>
      <div class="email_phone">
        <div class="form-group">
          <label for="email">EMAIL</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="phone">PHONE NUMBER</label>
          <input type="tel" id="phone" name="phone" required />
        </div>
      </div>
      <div class="password_cpassword">
        <div class="form-group">
          <label for="password">PASSWORD</label>
          <input type="password" id="password" name="password" required />
        </div>
        <div class="form-group">
          <label for="cpassword">CONFIRM PASSWORD</label>
          <input
            type="password"
            id="cpassword"
            name="confirm_password"
            required
          />
        </div>
      </div>
      <div class="btn">
        <button>Create Account</button>
        <p>Already have an account? <span>Log in</span></p>
      </div>
    </form>
  </body>
</html>
